; MD を 1 つ duty で回すだけの最小の例。主制御は ESP32 か RP2040
; CAN のピンは環境ごとに build_flags の CAN_TX、CAN_RX で決める
[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
lib_deps = mas

[env:esp32]
platform = espressif32
board = esp32dev
build_flags = -D CAN_TX=5 -D CAN_RX=4

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
build_flags = -D CAN_TX=5 -D CAN_RX=4

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = pico
board_build.core = earlephilhower
build_flags = -D CAN_TX=0 -D CAN_RX=1 ; can2040 は PIO 1
lib_deps =
    mas
    https://github.com/obdevel/ACAN2040.git#1.0.6 ; RP2040 の CAN（can2040、GPL-3.0）
