; MD を 1 つ duty で回すだけの最小の例。主制御は ESP32 か RP2040
[env]
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib
lib_deps = mas

[env:esp32]
platform = espressif32
board = esp32dev

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = pico
board_build.core = earlephilhower
lib_deps =
    mas
    https://github.com/obdevel/ACAN2040.git#1.0.6 ; RP2040 の CAN（can2040、GPL-3.0）
