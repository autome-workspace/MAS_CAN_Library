; オムニ機体を手動で操作する例（ライブラリの API を決めるための、使う側のたたき台）
; ライブラリはまだ無いので、このままではビルドできない。

[env:esp32s3]
platform = espressif32          ; PlatformIO 公式（arduino-esp32 2.x 系。2026-09-30 の決定）
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib      ; リポジトリの lib/ にある新しいライブラリを使う
