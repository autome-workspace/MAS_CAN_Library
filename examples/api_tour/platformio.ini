; ライブラリの API をひととおり使う例（中身はまだ仮）

[env:esp32s3]
platform = espressif32          ; PlatformIO 公式（arduino-esp32 2.x 系。2026-09-30 の決定）
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../../lib      ; リポジトリの lib/ にある新しいライブラリを使う
lib_deps = mas                  ; can.h が無くても補完の一覧（compiledb）に lib/mas を入れる
