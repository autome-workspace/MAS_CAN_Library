; XDrive の中継機（RP2040）。主バス（MAS CAN v1）では 4 ch の MD、下のバスで XDrive を 4 台まで。
; ピン・ch・XDrive の node_id は書き込む前にここで変える（README の表）。

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps =
    https://github.com/obdevel/ACAN2040.git#1.0.6
lib_extra_dirs = ../../lib
build_flags =
    -D MAS_TX=0
    -D MAS_RX=1
    -D XD_TX=3
    -D XD_RX=2
    -D MD_FIRST_CH=0
    -D XD_BAUD=250000
    -D XD_NODE0=0
    -D XD_NODE1=1
    -D XD_NODE2=2
    -D XD_NODE3=3
    ; r2（5 kg、φ60、X 配置）: 速度の加速度と慣性の FF（2026-11-22。XDrive は vel_gain 0.05、PASSTHROUGH）
    -D XD_ACCEL=10.0f
    -D XD_INERTIA=0.0145f
    -D XD_FRICTION=0.04f

; デバッグ用: USB シリアルに 1 秒ごとの状態を流す。pio run -e pico_debug -t upload; pio device monitor
[env:pico_debug]
extends = env:pico
build_flags =
    ${env:pico.build_flags}
    -D DEBUG_SERIAL
