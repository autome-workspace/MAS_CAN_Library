; micro-MD（CH32V203K8T6、DRV8701P、1 ch）。プロトコルの処理は lib/mas の node が受け持つ
[env:micro_md]
; プラットフォームと SDK は版を固定する（ツールチェーンは OS ごとにプラットフォームが gcc12 の枝から選ぶ）
platform = https://github.com/Community-PIO-CH32V/platform-ch32v.git#7c674802c9041d215c8cb285a9e787a4aa0b487b
platform_packages =
    framework-wch-noneos-sdk @ https://github.com/Community-PIO-CH32V/framework-wch-noneos-sdk.git#4fcf97265656d35226c1cc2425f90880a1beccdf
board = genericCH32V203K8T6
framework = noneos-sdk
; SystemInit は HSI のまま返し、main.c が 16 MHz のセラロックから 120 MHz にする
board_build.clock_source = hsi
board_build.f_cpu = 120000000L
board_build.ldscript = link.ld
build_flags =
    -D HSE_VALUE=16000000
    -I ../../lib/mas/include
    -Wall
extra_scripts = mas_node.py
upload_protocol = wch-link
