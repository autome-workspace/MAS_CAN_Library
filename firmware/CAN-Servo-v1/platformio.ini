; CAN-Servo 基板（RP2040-Zero）のプロトコル v1 のファーム。サーボ 8 ch ＋ MD（duty だけ）4 ch。
; 受け持つ ch の先頭は書き込む前にここで変える（サーボは 8 の倍数、MD は 4 の倍数）。

[platformio]
default_envs = pico

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git#9c167c6b8aac4f4cfa6d55a0c4e5b848795150c0
board = pico
framework = arduino
board_build.core = earlephilhower
lib_deps =
    https://github.com/obdevel/ACAN2040.git#1.0.6
lib_extra_dirs = ../../lib
build_flags =
    -D SERVO_FIRST_CH=0
    -D MD_FIRST_CH=0

; デバッグ用: USB シリアルに状態を流す。pio run -e pico_debug -t upload; pio device monitor
[env:pico_debug]
extends = env:pico
build_flags =
    ${env:pico.build_flags}
    -D DEBUG_SERIAL
